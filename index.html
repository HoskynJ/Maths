<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nel's Maths">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#173a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Nel's Block Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen iPad app. Night-green frame + top bar, a cream "workbook page" stage, a strip of grass blocks underfoot. */
:root{
  --night:#173a1f; --leaf:#3d7a3d; --paper:#f6f1e1; --card:#fffdf6; --ink:#1d2b1f; --muted:#5b6b5c;
  --gold:#f4c34b; --sky:#2f86b8; --clay:#e8893a; --plum:#7a55a0; --berry:#d9564a; --line:#dcd3b8;
  --display:'Lilita One','Arial Rounded MT Bold',ui-rounded,sans-serif;
  --body:'Andika','Comic Neue',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;
  background:
    linear-gradient(to top,#6b4526 0 12px,#5fa832 12px 20px,#7cc444 20px 26px,transparent 26px),
    var(--night);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;padding-bottom:34px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;color:var(--paper);min-height:56px}
.bar h1{font:400 clamp(20px,3vw,28px)/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:.5px;text-wrap:balance}
.bar h1 small{display:block;font:700 13px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.icon-btn{width:52px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.icon-btn svg{width:28px;height:28px}
.purse{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);padding:6px 14px 6px 8px;border-radius:999px;font:400 24px var(--display);color:var(--gold)}
.purse .cube{width:30px}

/* stage */
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);border-radius:22px;padding:clamp(14px,2.5vw,28px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:16px;-webkit-overflow-scrolling:touch}

/* home */
.home-head{width:100%;max-width:980px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.home-head h2{font:400 clamp(28px,4.5vw,44px)/1 var(--display);margin:0;color:var(--night)}
.home-head p{margin:4px 0 0;color:var(--muted)}
.chapter{width:100%;max-width:980px}
.chapter h3{font:700 14px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:8px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--c,var(--leaf));border-radius:18px;padding:12px 14px;min-height:88px;box-shadow:0 4px 0 var(--c,var(--leaf))}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.tile .ic{flex:none;width:58px;display:grid;place-items:center}
.tile .ic svg{width:100%}
.tile b{font:400 21px/1.1 var(--display);display:block}
.tile span{font-size:14px;color:var(--muted)}
.tile .stars{display:flex;gap:3px;margin-top:4px}
.tile .stars i{width:14px;height:14px;border-radius:3px;background:var(--line)}
.tile .stars i.on{background:var(--gold)}
.foot{width:100%;max-width:980px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:6px;padding-top:12px;border-top:2px dashed var(--line)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--paper)}

/* level picker */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:900px}
.lvl{border:0;border-radius:22px;padding:22px 20px;text-align:left;color:#fff;min-height:170px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvl small{font:700 14px var(--body);letter-spacing:1.8px;text-transform:uppercase;opacity:.9}
.lvl b{font:400 32px/1 var(--display)}
.lvl span{font-size:18px;line-height:1.35}
.lvl.l1{background:var(--leaf)} .lvl.l2{background:var(--sky)} .lvl.l3{background:var(--clay)}
.mission-intro{display:flex;align-items:center;gap:16px;max-width:900px;width:100%}
.mission-intro .ic{width:90px;flex:none}
.mission-intro h2{font:400 clamp(28px,4vw,40px)/1 var(--display);margin:0}
.mission-intro p{margin:6px 0 0;color:var(--muted)}
.tip{max-width:900px;width:100%;box-sizing:border-box;background:#e6f0da;border:2px solid #bcd3a7;border-radius:16px;padding:12px 16px;font-size:16px}

/* play */
.progress{display:flex;gap:6px;align-items:center}
.progress .cube{width:34px;filter:grayscale(1) opacity(.35)}
.progress .cube.done{filter:none}
.progress .cube.now{filter:grayscale(1) opacity(.7);transform:translateY(-4px)}
.prompt{display:flex;align-items:center;gap:12px;max-width:900px;justify-content:center}
.prompt p{font:400 clamp(24px,3.6vw,36px)/1.15 var(--display);margin:0;text-align:center;text-wrap:balance;color:var(--night)}
.speak{width:56px;height:56px;border-radius:50%;border:0;background:var(--sky);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #1f5f84}
.speak svg{width:28px;height:28px}
.scene{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.hint{font-size:15px;color:var(--muted);margin:-6px 0 0}
.field,.row,.wall{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 14px;max-width:720px}
.wall{gap:6px;max-width:600px}
.thing{position:relative;background:none;border:0;padding:4px;transform:rotate(var(--r,0deg)) translateY(var(--y,0px));line-height:0}
.thing .cube{width:clamp(40px,6vw,56px)}
.thing .ani{width:clamp(64px,10vw,96px)}
.dense .thing .cube{width:clamp(30px,4.4vw,42px)}
.dense .thing .ani{width:clamp(50px,7vw,70px)}
.thing.counted::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--sky);color:#fff;font:400 20px/1 var(--display);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 0 #1f5f84}
.crumble{animation:fall .9s ease-in 1s forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(70px) rotate(28deg);opacity:.18}}
.sum{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:360px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.op{font:400 54px var(--display);color:var(--leaf)}
.sentence{font:400 clamp(30px,4.6vw,46px) var(--display);color:var(--ink);letter-spacing:2px;font-variant-numeric:tabular-nums}
.slot{width:clamp(40px,6vw,56px);aspect-ratio:40/46;max-width:100%;border:3px dashed #9aa093;border-radius:8px;box-sizing:border-box;display:grid;place-items:center;font:400 28px var(--display);color:#9aa093}
.trail{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stone{width:clamp(64px,10vw,92px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:400 clamp(28px,4.4vw,42px) var(--display);color:#fff;background:#83878b;box-shadow:inset 0 -8px 0 #6c7074,inset 0 6px 0 #a3a7ab;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.stone.q{background:var(--card);color:var(--sky);border:4px dashed var(--sky);box-shadow:none;text-shadow:none}
.pattern{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pattern .cube{width:clamp(44px,6.5vw,62px)}
.pattern .slot{width:clamp(44px,6.5vw,62px)}
.tower{display:flex;flex-direction:column-reverse;align-items:center;--w:clamp(40px,6vw,54px)}
.tower .cube{width:var(--w)}
.tower .cube:not(:last-child){margin-top:calc(var(--w) * -0.575)}
.pens{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.penbox{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:260px;padding:14px;border:4px solid #8a5a32;border-radius:12px;background:#eef3e0}

.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pick{min-width:96px;height:96px;padding:0 14px;border-radius:20px;border:4px solid var(--night);background:var(--card);font:400 48px var(--display);color:var(--night);box-shadow:0 6px 0 var(--night);display:grid;place-items:center}
.pick .cube{width:58px}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--night)}
.pick.wrong{opacity:.35;animation:shake .4s;pointer-events:none}
.pick.right{background:var(--gold);border-color:#b98a10;box-shadow:0 6px 0 #b98a10}
.pick.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{background:#fff3c4}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.option{border:4px solid var(--line);background:var(--card);border-radius:22px;padding:16px;min-width:180px;min-height:160px;display:flex;align-items:flex-end;justify-content:center;box-shadow:0 6px 0 var(--line)}
.option.wrong{opacity:.35;animation:shake .4s;pointer-events:none}
.option.right{border-color:var(--gold);box-shadow:0 6px 0 #b98a10;background:#fff6d6}
.option .row{max-width:300px}
.option .cube{width:44px}.option .ani{width:66px}

.build{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:center;width:100%}
.target{font:400 clamp(70px,11vw,120px)/1 var(--display);color:var(--leaf);min-width:120px;text-align:center}
.towers{display:flex;gap:14px;align-items:flex-end;min-height:120px;min-width:120px;justify-content:center;padding:10px 16px;border-bottom:6px solid #6b4526;background:none;border-top:0;border-left:0;border-right:0}
.towers .empty{color:var(--muted);font-size:16px;padding-bottom:20px}
.count-badge{font:400 28px var(--display);color:var(--sky);min-height:34px}
.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{border:0;border-radius:18px;padding:16px 24px;font:400 26px var(--display);min-height:68px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn .cube{width:40px}
.btn.add{background:#e6f0da;color:var(--night)}
.btn.soft{background:var(--card);color:var(--night);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.go{background:var(--leaf);color:#fff}
.btn.gold{background:var(--gold);color:var(--night)}
.share{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-end;width:100%}
.pile{display:flex;flex-wrap:wrap;gap:4px;max-width:240px;justify-content:center;padding:12px;border-radius:18px;border:3px dashed var(--gold);min-height:60px;min-width:120px;align-items:center}
.pile .cube{width:38px}
.feeder{border:4px solid var(--line);background:var(--card);border-radius:22px;padding:12px;width:clamp(150px,22vw,210px);display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 var(--line)}
.feeder:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.feeder .ani{width:90px}
.basket{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:36px}
.basket .cube{width:28px}
.feeder b{font:400 28px var(--display);color:var(--clay)}

.fb{min-height:80px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fb .yes{font:400 clamp(28px,4vw,40px) var(--display);color:var(--leaf)}
.fb .soft{font-size:20px;color:var(--muted)}
.pop{animation:popin .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}

/* finish */
.done h2{font:400 clamp(36px,6vw,60px)/1 var(--display);margin:0;color:var(--night);text-align:center}
.done p{text-align:center;margin:0;color:var(--muted);font-size:20px}
.stash{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:360px}
.stash .cube{width:48px;animation:popin .5s backwards}
.routes{width:100%;max-width:760px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-sizing:border-box}
.routes h3{margin:0 0 10px;font:700 14px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.routes .toggles .chip{font-size:15px}
.r1[aria-pressed="true"]{background:var(--sky);border-color:var(--sky)}
.r2[aria-pressed="true"]{background:var(--clay);border-color:var(--clay)}
.r3[aria-pressed="true"]{background:var(--plum);border-color:var(--plum)}
.r4[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf)}
.r5[aria-pressed="true"]{background:var(--berry);border-color:var(--berry)}
.r1,.r2,.r3,.r4,.r5{color:var(--ink)}
[aria-pressed="true"].r1,[aria-pressed="true"].r2,[aria-pressed="true"].r3,[aria-pressed="true"].r4,[aria-pressed="true"].r5{color:#fff}

/* notes */
.notes{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;gap:4px}
.note .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.note .when{color:var(--muted);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.note .tags{display:flex;gap:6px;flex-wrap:wrap}
.note .tags span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e6f0da}
.empty-note{color:var(--muted);text-align:center;padding:30px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}
  .crumble{animation:none;opacity:.18}
}
@media (max-width:520px){.pick{min-width:76px;height:80px;font-size:38px}.option{min-width:140px}}
</style>
<style>
[hidden]{display:none!important} img{max-width:100%}
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>


<div id="app">
  <header class="bar">
    <button class="icon-btn" data-act="home" aria-label="Home" id="homeBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="#f6f1e1" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>
    <h1 id="title"><small>Made for Nel</small>Block Maths Adventures</h1>
    <div class="purse" aria-label="Treasure blocks"><span id="purseCube"></span><b id="gold">0</b></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function choicesFor(ans,min=0,max=30,n=3){const s=new Set([ans]);let t=0;while(s.size<n&&t<80){t++;const v=ans+pick([-2,-1,1,2,3,-3]);if(v>=min&&v<=max)s.add(v)}return shuffle([...s])}

/* ---------- storage (per-device convenience) ---------- */
const KEY='nelBlocks';
let DB={gold:0,logs:[],best:{},voice:true,sound:true};
try{Object.assign(DB,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};

/* ---------- sound + voice ---------- */
let ac;
function tone(f,d,t=0,type='square',v=.05){if(!DB.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d+.03)}catch(e){}}
const sfx={yes(){tone(660,.12);tone(880,.12,.1);tone(1320,.22,.2)},no(){tone(196,.22,0,'triangle',.09)},pop(){tone(480+Math.random()*200,.07,0,'square',.035)},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,i*.12))}};
function say(t){if(!DB.voice)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;u.pitch=1.05;const v=s.getVoices().find(v=>/en[-_]GB/i.test(v.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}

/* ---------- art: blocks + blocky farm animals (original drawings) ---------- */
const BL={
  grass:{t:'#7cc444',l:'#8a5a32',r:'#6e4626',band:['#5fa832','#4f8f28'],sp:'#5e3c1f'},
  stone:{t:'#a5a9ad',l:'#878b8f',r:'#6f7377',sp:'#5d6165'},
  wood:{t:'#c99a5b',l:'#7a5230',r:'#5f3f24',ring:true,sp:'#4c321c'},
  gold:{t:'#ffde5c',l:'#f2b92b',r:'#d39a17',shine:true,sp:'#fff1a8'}
};
const NAME={grass:'grass',stone:'stone',wood:'wood',gold:'treasure'};
function speck(face,u,v,c){const s=3;if(face==='l'){const y=x=>11.5+x*.5525;return`<polygon points="${u},${y(u)+v} ${u+s},${y(u+s)+v} ${u+s},${y(u+s)+v+s} ${u},${y(u)+v+s}" fill="${c}"/>`}
  const y=x=>22-(x-20)*.5525;return`<polygon points="${u},${y(u)+v} ${u+s},${y(u+s)+v} ${u+s},${y(u+s)+v+s} ${u},${y(u)+v+s}" fill="${c}" opacity=".7"/>`}
function cube(k,cls=''){const c=BL[k];let s=`<svg class="cube ${cls}" viewBox="0 0 40 46" aria-hidden="true"><polygon points="20,1 39,11.5 20,22 1,11.5" fill="${c.t}"/><polygon points="1,11.5 20,22 20,45 1,34.5" fill="${c.l}"/><polygon points="20,22 39,11.5 39,34.5 20,45" fill="${c.r}"/>`;
  s+=speck('l',4,10,c.sp)+speck('l',12,4,c.sp)+speck('l',7,17,c.sp)+speck('r',25,8,c.sp)+speck('r',32,15,c.sp)+speck('r',28,1,c.sp);
  if(c.band)s+=`<polygon points="1,11.5 20,22 20,28 1,17.5" fill="${c.band[0]}"/><polygon points="20,22 39,11.5 39,17.5 20,28" fill="${c.band[1]}"/><polygon points="10,9 13,7.5 16,9 13,10.5" fill="#9bd65f"/><polygon points="24,12 27,10.5 30,12 27,13.5" fill="#5fa832"/>`;
  if(c.ring)s+=`<polygon points="20,5 31,11.5 20,18 9,11.5" fill="none" stroke="#8e6435" stroke-width="1.6"/><polygon points="20,8.5 25,11.5 20,14.5 15,11.5" fill="none" stroke="#8e6435" stroke-width="1.2"/>`;
  if(c.shine)s+=`<polygon points="12,9 20,4.5 22,5.6 14,10" fill="#fff6c9"/><polygon points="5,19 8,20.7 8,26 5,24.3" fill="#ffe680"/>`;
  return s+`<polyline points="1,11.5 20,22 39,11.5" fill="none" stroke="rgba(255,255,255,.28)"/></svg>`}
function ani(k){const o={

 const by={};M.forEach(m=>(by[m.ch]=by[m.ch]||[]).push(m));

function start(id,l){const m=M.find(x=>x.id===id);S={m,l,i:0,total:5,first:0,miss:0,round:null,locked:false};setBar(m.title,`${LV[l-1][0]} · ${m.lv[l-1]}`);$('#homeBtn').hidden=false;next()}
function next(){if(S.i>=S.total)return finish();S.round=S.m.gen(S.l);S.miss=0;S.locked=false;render();say(S.round.say)}
function progress(){return`<div class="progress" aria-label="Round ${S.i+1} of ${S.total}">${Array.from({length:S.total},(_,i)=>cube('gold',i<S.i?'done':i===S.i?'now':'')).join('')}</div>`}

function render(){const r=S.round;let body='';
 if(r.t==='choice')body=`<div class="scene">${r.scene}</div><div class="choices">${r.choices.map(c=>`<button class="pick" data-act="answer" data-v="${c}" aria-label="${r.fmt?NAME[c]:c}">${r.fmt?r.fmt(c):c}</button>`).join('')}</div>`;
 if(r.t==='pick')body=`<div class="choices">${r.opts.map((o,i)=>`<button class="option" data-act="opt" data-i="${i}">${o.h}</button>`).join('')}</div>`;
 if(r.t==='build')body=buildHTML(r);
 if(r.t==='share')body=shareHTML(r);
 stage().innerHTML=`${progress()}<div class="prompt">${speakerBtn()}<p>${r.say}</p></div>${body}<div class="fb" id="fb"></div>`;
 stage().scrollTop=0}

function towersInner(r){if(!r.h)return'<span class="empty">Tap “Add a block”</span>';let out='',h=r.h;while(h>0){const c=Math.min(10,h);out+=tower(r.kind,c);h-=c}return out}

function correct(text){S.locked=true;if(!S.miss)S.first++;S.i++;DB.gold++;save();$('#gold').textContent=DB.gold;sfx.yes();say(text);

function wrong(msg){S.miss++;sfx.no();$('#fb').innerHTML=`<div class="soft pop">${msg||'Not quite. Have another go!'}</div>`;if(msg)say(msg)}

 again(){start(S.m.id,S.l)},
 up(){start(S.m.id,S.l+1)},
 route(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const L=DB.logs[0];if(L){const v=b.dataset.v;L.routes=on?[...new Set([...L.routes,v])]:L.routes.filter(x=>x!==v);save()}},
 notes(){showNotes()},
 clear(b){b.parentElement.innerHTML=`<span>Delete all notes on this iPad?</span><button class="chip" data-act="clearyes">Yes, delete</button><button class="chip" data-act="notes">Keep them</button>`},
 clearyes(){DB.logs=[];save();showNotes()}
};
function upd(){const r=S.round;$('#towers').innerHTML=towersInner(r);$('#cnt').textContent=r.show&&r.h?r.h+(r.h===1?' block':' blocks'):'';$('#fb').innerHTML=''}
function rerenderShare(){const r=S.round,wrap=stage();const sh=wrap.querySelector('.share'),pile=wrap.querySelector('.pile'),tools=wrap.querySelector('.tools');const tmp=document.createElement('div');tmp.innerHTML=shareHTML(r);sh.replaceWith(tmp.children[0]);pile.replaceWith(tmp.children[0]);tools.replaceWith(tmp.children[0])}
function checkShare(){const r=S.round,m=r.got.length,eq=r.got.every(g=>g===r.got[0]);
 if(eq&&r.left<m){const each=r.got[0];return correct(`Fair! ${r.n} shared by ${m} is ${each} each${r.left?`, with ${r.left} left over`:''}.`)}
 if(!eq&&r.left<m)wrong('Hmm, is that fair? Someone has more. Tap Start again.')}

/* ---------- finish + notes ---------- */
function logIt(routes){DB.logs.unshift({d:Date.now(),m:S.m.id,l:S.l,done:S.i,of:S.total,first:S.first,routes});DB.logs=DB.logs.slice(0,200);save()}
function finish(){const m=S.m;DB.best[m.id]=Math.max(DB.best[m.id]||0,S.l);logIt([]);save();sfx.win();
 say(`Mission complete! Brilliant building, Nel!`);
 stage().innerHTML=`<div class="done" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%">
  <h2>Mission complete!</h2><p>${m.title} · ${LV[S.l-1][0]} · ${S.total} treasure blocks won</p>
  <div class="stash">${Array.from({length:S.total},(_,i)=>cube('gold').replace('class="cube "',`class="cube" style="animation-delay:${i*.12}s"`)).join('')}</div>
  <div class="tools"><button class="btn go" data-act="again">Play again</button>${S.l<3?`<button class="btn gold" data-act="up">Try ${LV[S.l][0]}</button>`:''}<button class="btn soft" data-act="home">Other missions</button></div>
  <div class="routes"><h3>For Niamh · optional · how did Nel join in?</h3><div class="toggles">${ROUTES.slice(0,4).map((r,i)=>`<button class="chip r${i+1}" data-act="route" data-v="${r}" aria-pressed="false">${r}</button>`).join('')}</div></div></div>`;
 S.i=S.total}
function showNotes(){S=null;setBar('Notes for Niamh','These notes are about the activity, not Nel');$('#homeBtn').hidden=false;
 const name=id=>(M.find(m=>m.id===id)||{}).title||id,fmt=d=>new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 const fav={};DB.logs.forEach(L=>fav[L.m]=(fav[L.m]||0)+1);const top=Object.entries(fav).sort((a,b)=>b[1]-a[1])[0];
 stage().innerHTML=`<div class="notes"><p class="tip"><b>Saved on this iPad only.</b> ${DB.logs.length?`${DB.logs.length} sessions so far. Most played: <b>${name(top[0])}</b>. Repeating a favourite counts too.`:'Notes appear here after each mission.'}</p>
 ${DB.logs.length?DB.logs.map(L=>`<div class="note"><div class="top"><span>${name(L.m)} · ${LV[L.l-1][0]}</span><span class="when">${fmt(L.d)}</span></div><div>${L.done} of ${L.of} rounds · ${L.first} right first try</div>${L.routes.length?`<div class="tags">${L.routes.map(r=>`<span>${r}</span>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty-note">No missions played yet.</div>'}
 ${DB.logs.length?'<div class="confirm"><button class="chip" data-act="clear">Clear all notes</button></div>':''}</div>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=H[b.dataset.act];if(f)f(b,e)});
$('#purseCube').innerHTML=cube('gold');
try{speechSynthesis.getVoices()}catch(e){}
showHome();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
