<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nel's Maths">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#173a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Nel's Block Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen iPad game. Night-green frame + top bar, a cream "workbook page" stage, grass strip underfoot. Boards are rows of drop zones (fields, pens, towers, carts) that wrap on narrow screens. */
:root{
  --night:#173a1f; --leaf:#3d7a3d; --paper:#f6f1e1; --card:#fffdf6; --ink:#1d2b1f; --muted:#5b6b5c;
  --gold:#f4c34b; --sky:#2f86b8; --clay:#e8893a; --plum:#7a55a0; --berry:#d9564a; --line:#dcd3b8;
  --grass:#d3eab0; --grass2:#bfdc97; --dirt:#6b4526; --fence:#8a5a32; --rock:#cfd2cf;
  --display:'Lilita One','Arial Rounded MT Bold',ui-rounded,sans-serif;
  --body:'Andika','Comic Neue',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;
  background:linear-gradient(to top,var(--dirt) 0 12px,#5fa832 12px 20px,#7cc444 20px 26px,transparent 26px),var(--night);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;padding-bottom:34px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.bar{display:flex;align-items:center;gap:12px;padding-block:10px;color:var(--paper);min-height:56px}
.bar h1{font:400 clamp(20px,3vw,28px)/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:.5px;text-wrap:balance}
.bar h1 small{display:block;font:700 13px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.icon-btn{width:52px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.icon-btn svg{width:28px;height:28px}
.purse{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);padding:6px 14px 6px 8px;border-radius:999px;font:400 24px var(--display);color:var(--gold)}
.purse .cube{width:30px}

.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);border-radius:22px;padding:clamp(12px,2.2vw,26px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}

/* home */
.home-top{width:100%;max-width:980px;display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.hello{flex:1 1 300px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-width:0}
.hello h2{font:400 clamp(28px,4.5vw,44px)/1 var(--display);margin:0;color:var(--night)}
.hello p{margin:0;color:var(--muted)}
.buildcard{flex:1 1 320px;background:linear-gradient(#cfe8f5,#e9f4fa 70%);border:3px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;gap:14px;align-items:flex-end;min-width:0;box-sizing:border-box}
.buildcard svg{width:min(190px,42vw);flex:none}
.buildcard b{font:400 22px/1.1 var(--display);display:block;color:var(--night)}
.buildcard span{font-size:15px;color:var(--muted)}
.meter{height:12px;border-radius:99px;background:rgba(0,0,0,.1);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.chapter{width:100%;max-width:980px}
.chapter h3{font:700 14px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--c,var(--leaf));border-radius:18px;padding:12px 14px;min-height:88px;box-shadow:0 4px 0 var(--c,var(--leaf))}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.tile .ic{flex:none;width:58px;display:grid;place-items:center}
.tile .ic svg{width:100%}
.tile b{font:400 21px/1.1 var(--display);display:block}
.tile span{font-size:14px;color:var(--muted)}
.tile .stars{display:flex;gap:3px;margin-top:4px}
.tile .stars i{width:14px;height:14px;border-radius:3px;background:var(--line)}
.tile .stars i.on{background:var(--gold)}
.foot{width:100%;max-width:980px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:6px;padding-top:12px;border-top:2px dashed var(--line)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--paper)}

/* levels */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:900px}
.lvl{border:0;border-radius:22px;padding:22px 20px;text-align:left;color:#fff;min-height:170px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvl small{font:700 14px var(--body);letter-spacing:1.8px;text-transform:uppercase;opacity:.9}
.lvl b{font:400 32px/1 var(--display)}
.lvl span{font-size:18px;line-height:1.35}
.lvl.l1{background:var(--leaf)} .lvl.l2{background:var(--sky)} .lvl.l3{background:var(--clay)}
.mission-intro{display:flex;align-items:center;gap:16px;max-width:900px;width:100%}
.mission-intro .ic{width:90px;flex:none}
.mission-intro h2{font:400 clamp(28px,4vw,40px)/1 var(--display);margin:0}
.mission-intro p{margin:6px 0 0;color:var(--muted)}
.tip{max-width:900px;width:100%;box-sizing:border-box;background:#e6f0da;border:2px solid #bcd3a7;border-radius:16px;padding:12px 16px;font-size:16px;margin:0}

/* play chrome */
.progress{display:flex;gap:6px;align-items:center}
.progress .cube{width:34px;filter:grayscale(1) opacity(.35)}
.progress .cube.done{filter:none}
.progress .cube.now{filter:grayscale(1) opacity(.7);transform:translateY(-4px)}
.prompt{display:flex;align-items:center;gap:12px;max-width:900px;justify-content:center}
.prompt p{font:400 clamp(22px,3.3vw,34px)/1.15 var(--display);margin:0;text-align:center;text-wrap:balance;color:var(--night)}
.speak{width:56px;height:56px;border-radius:50%;border:0;background:var(--sky);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #1f5f84}
.speak svg{width:28px;height:28px}
.hint{font-size:15px;color:var(--muted);margin:0;text-align:center}

/* board + zones */
.board{display:flex;flex-wrap:wrap;gap:16px 18px;justify-content:center;align-items:flex-end;width:100%;max-width:1040px}
.board.col{flex-direction:column;align-items:center}
.zwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;max-width:100%}
.zlabel{font:700 13px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.badge{position:absolute;top:-10px;right:-10px;min-width:40px;height:40px;padding:0 8px;box-sizing:border-box;border-radius:20px;background:var(--sky);color:#fff;font:400 24px/40px var(--display);text-align:center;box-shadow:0 3px 0 #1f5f84;z-index:3}
.zone{position:relative;border-radius:18px;transition:box-shadow .15s,transform .15s;box-sizing:border-box;max-width:100%}
.zone .zin{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;align-content:flex-end;gap:4px 6px;min-height:inherit}
.zone.hot{box-shadow:0 0 0 5px var(--gold),0 0 22px rgba(244,195,75,.8);transform:scale(1.02)}
.field{background:radial-gradient(circle at 20% 30%,var(--grass2) 0 3px,transparent 4px) 0 0/34px 30px,var(--grass);padding:14px;min-width:200px;max-width:560px;min-height:120px}
.field.rock{background:radial-gradient(circle at 30% 40%,#b9bdb9 0 4px,transparent 5px) 0 0/30px 26px,var(--rock)}
.pen{background:#eef3e0;border:7px solid var(--fence);padding:12px;min-width:calc(var(--as) * 2.6);min-height:calc(var(--as) * 1.6);box-shadow:inset 0 0 0 3px #b0814f}
.pen::before,.pen::after{content:"";position:absolute;top:-16px;width:12px;height:22px;background:var(--fence);border-radius:3px}
.pen::before{left:12px}.pen::after{right:12px}
.barn{border-color:#a5362b;box-shadow:inset 0 0 0 3px #c9584a}
.barn::before,.barn::after{background:#a5362b}
.pad{min-width:calc(var(--bs) * 2.4);min-height:calc(var(--bs) * 2.2);padding:8px 12px 0;border-bottom:8px solid var(--dirt);border-radius:0}
.pad .zin{flex-direction:column-reverse;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:0}
.pad .item{padding:0}
.pad .item:not(:first-child){margin-bottom:calc(var(--bs) * -0.575)}
.pad .item svg{transform:none}
.cart{background:#5f6368;border-radius:6px 6px 34px 34px;padding:12px 14px 22px;min-width:calc(var(--bs) * 3.4);min-height:calc(var(--bs) * 1.8);box-shadow:inset 0 -8px 0 #45484c;margin-bottom:18px}
.cart::before,.cart::after{content:"";position:absolute;bottom:-18px;width:28px;height:28px;border-radius:50%;background:#2f3134;border:5px solid #8b8f93;box-sizing:border-box}
.cart::before{left:18%}.cart::after{right:18%}
.feeder{background:var(--card);border:4px solid var(--line);padding:10px;width:clamp(140px,21vw,210px);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line)}
.feeder > .ani{width:calc(var(--as) * 1.05);max-width:100%;pointer-events:none}
.feeder .zin{min-height:calc(var(--ts) + 8px);width:100%;background:#f1e3c4;border-radius:12px;padding:6px;box-sizing:border-box;align-content:flex-start;align-items:flex-start}
.pile{border:3px dashed var(--gold);background:#fff8e2;padding:12px;min-width:min(200px,100%);max-width:520px;min-height:80px}
.tilebox{background:#eceae2;padding:12px;min-width:200px;min-height:90px}
.gap{border:3px dashed #9aa093;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}
.gap .zin{min-height:0}
.gap .item{padding:0}
.gap .item svg{transform:none}
.bgap{width:var(--bs);height:calc(var(--bs) * 1.15)}
.pgap{width:var(--bs);height:calc(var(--bs) * 1.15)}
.ngap{width:var(--ns);height:var(--ns);border-color:var(--sky);border-radius:14px}
.gap .item{box-shadow:0 0 0 3px var(--gold);border-radius:6px}
.tz{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:10px 14px 0;border-bottom:8px solid var(--dirt);border-radius:0;min-width:calc(var(--bs) * 2.6);min-height:calc(var(--ts) + 20px)}
.tz.penfix{border:7px solid var(--fence);border-radius:18px;background:#eef3e0;padding:12px;min-width:calc(var(--as) * 3)}
.tz .zin{order:-1;min-height:var(--ts)}
.fixrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;max-width:440px}
.fixrow .ani{width:var(--as)}
.tower{display:flex;flex-direction:column-reverse;align-items:center}
.tower .cube{width:var(--bs)}
.tower .cube:not(:first-child){margin-bottom:calc(var(--bs) * -0.575)}
.wallrow,.pattern,.trail{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:760px}
.wallrow{background:var(--rock);padding:12px;border-radius:16px;gap:4px}
.wallrow .fixed .cube,.pattern .fixed .cube{width:var(--bs)}
.fixed{line-height:0}
.trail{gap:10px}
.trailstep{position:relative}
.stone,.ntile{width:var(--ns);aspect-ratio:1;max-width:100%;border-radius:14px;display:grid;place-items:center;font:400 calc(var(--ns) * .48) var(--display);color:#fff;background:#83878b;box-shadow:inset 0 -7px 0 #6c7074,inset 0 5px 0 #a3a7ab;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1}
.ntile{background:var(--sky);box-shadow:inset 0 -7px 0 #1f5f84,inset 0 5px 0 #5aa8d4}
.hopper{position:absolute;bottom:72%;left:calc(50% - var(--ns) * .45);width:calc(var(--ns) * .9);pointer-events:none;z-index:4}
.palette{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:12px;border-radius:18px;background:#eceae2}
.spawner{touch-action:none;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px 8px;border-radius:16px;background:#c99a5b;border:4px solid #7a5230;box-shadow:inset 0 0 0 3px #e0b77c,0 5px 0 #5f3f24;line-height:1}
.spawner .cube{width:calc(var(--bs) * 1.1)}
.spawner span{font:700 12px var(--body);letter-spacing:1px;text-transform:uppercase;color:#3b2512}
.palette .spawner{background:var(--card);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.spawner.selected{box-shadow:0 0 0 5px var(--gold),0 5px 0 #5f3f24}
.target-num{font:400 clamp(70px,11vw,120px)/1 var(--display);color:var(--leaf);min-width:100px;text-align:center;align-self:center}
.arrow{width:46px;color:#9aa093;align-self:center;flex:none}
.op{font:400 54px var(--display);color:var(--leaf);align-self:center}

/* items */
.item{touch-action:none;cursor:grab;line-height:0;padding:3px;border-radius:12px;position:relative}
.item svg{transform:rotate(var(--r,0deg));display:block}
.item .ani{width:var(--as)}
.item .cube{width:var(--bs)}
.item .tok{width:var(--ts)}
.item.lifted{opacity:.25}
.item.selected{background:rgba(244,195,75,.55);box-shadow:0 0 0 4px var(--gold)}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.3));will-change:transform}
.numbered{counter-reset:n}
.numbered .item{counter-increment:n}
.numbered .item::after{content:counter(n);position:absolute;top:-6px;right:-6px;background:var(--sky);color:#fff;font:400 17px/28px var(--display);min-width:28px;height:28px;text-align:center;border-radius:14px;box-shadow:0 2px 0 #1f5f84;z-index:2}
.pad.numbered .item::after{top:auto;bottom:22%;right:-34px}
.board.locked .item{cursor:pointer}

/* tools, questions, feedback */
.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tools:empty{display:none}
.btn{border:0;border-radius:18px;padding:14px 22px;font:400 24px var(--display);min-height:64px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn .cube{width:38px}
.btn.soft{background:var(--card);color:var(--night);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.go{background:var(--leaf);color:#fff}
.btn.gold{background:var(--gold);color:var(--night)}
#q{display:flex;flex-direction:column;align-items:center;gap:12px}
#q:empty{display:none}
.sentence{font:400 clamp(30px,4.6vw,46px) var(--display);color:var(--ink);letter-spacing:2px;font-variant-numeric:tabular-nums;text-align:center}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pick{min-width:96px;height:96px;padding:0 14px;border-radius:20px;border:4px solid var(--night);background:var(--card);font:400 48px var(--display);color:var(--night);box-shadow:0 6px 0 var(--night)}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--night)}
.pick.wrong{opacity:.35;animation:shake .4s;pointer-events:none}
.pick.right{background:var(--gold);border-color:#b98a10;box-shadow:0 6px 0 #b98a10}
.pick.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{background:#fff3c4}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:60px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fb .yes{font:400 clamp(26px,3.8vw,38px) var(--display);color:var(--leaf)}
.fb .soft{font-size:20px;color:var(--muted);max-width:640px}
.pop{animation:popin .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}

/* finish */
.done{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.done h2{font:400 clamp(36px,6vw,60px)/1 var(--display);margin:0;color:var(--night);text-align:center}
.done p{text-align:center;margin:0;color:var(--muted);font-size:20px}
.bigbuild{background:linear-gradient(#cfe8f5,#e9f4fa 75%);border:3px solid var(--line);border-radius:22px;padding:16px 20px 0;display:flex;justify-content:center}
.bigbuild svg{width:min(330px,72vw);display:block}
.newb{animation:drop .55s cubic-bezier(.3,1.5,.6,1) backwards}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.routes{width:100%;max-width:760px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-sizing:border-box}
.routes h3{margin:0 0 10px;font:700 14px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.routes .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}

/* notes */
.notes{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;gap:4px}
.note .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.note .when{color:var(--muted);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.note .tags{display:flex;gap:6px;flex-wrap:wrap}
.note .tags span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e6f0da}
.empty-note{color:var(--muted);text-align:center;padding:30px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* shop, clock, halves, tens */
.ware{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff8e2;border:4px solid #c99a5b;border-radius:18px;padding:14px 18px;align-self:center}
.ware svg{width:calc(var(--bs) * 1.4)}
.tag{font:400 30px var(--display);background:var(--berry);color:#fff;padding:2px 14px;border-radius:10px;box-shadow:0 3px 0 #a3392f}
.counter{background:#e9d3a8;border:5px solid #8a5a32;border-radius:14px;padding:12px;min-width:220px;min-height:110px}
.palette .spawner .coin{width:calc(var(--ts) * 1.6)}
.spawner .tok{width:calc(var(--ts) * 1.15)}
.item .coin{width:var(--ts)}
.ctower{margin-top:26px;background:repeating-linear-gradient(0deg,#8f9397 0 22px,#7c8084 22px 24px),#8f9397;padding:18px 18px 22px;border-radius:12px 12px 0 0;border-bottom:8px solid var(--dirt);position:relative;align-self:center}
.ctower::before{content:"";position:absolute;left:-8px;right:-8px;top:-22px;height:24px;background:repeating-linear-gradient(90deg,#6f7377 0 26px,transparent 26px 40px)}
.clock{width:min(260px,58vw);display:block}
.clock .hand{transform-box:view-box;transform-origin:100px 100px;transition:transform .5s cubic-bezier(.3,1.3,.6,1)}
.hourbtn{cursor:pointer}
.hourbtn:active circle{fill:rgba(47,134,184,.25)}
.tcard{display:inline-block;background:var(--card);border:3px solid var(--night);border-radius:12px;padding:10px 14px;font:400 24px/1 var(--display);color:var(--night);white-space:nowrap;box-shadow:0 4px 0 var(--night)}
.signz{border:3px dashed var(--sky);border-radius:14px;min-width:190px;min-height:62px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6)}
.signz .item{padding:0}
.plate{width:clamp(150px,22vw,220px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,#fffdf6 0 58%,#e7e1cf 59% 64%,#fffdf6 65%);border:4px solid #d8cfb5;display:flex;align-items:center;justify-content:center;padding:18%}
.plate .zin{align-content:center;align-items:center}
.cake{width:clamp(110px,16vw,150px);display:block}

/* ================= helpers ================= */

};
function speck(face,u,v,c){const s=3;if(face==='l'){const y=x=>11.5+x*.5525;return`<polygon points="${u},${y(u)+v} ${u+s},${y(u+s)+v} ${u+s},${y(u+s)+v+s} ${u},${y(u)+v+s}" fill="${c}"/>`}
  const y=x=>22-(x-20)*.5525;return`<polygon points="${u},${y(u)+v} ${u+s},${y(u+s)+v} ${u+s},${y(u+s)+v+s} ${u},${y(u)+v+s}" fill="${c}" opacity=".7"/>`}
function cube(k,cls=''){const c=BL[k];let s=`<svg class="cube ${cls}" viewBox="0 0 40 46" aria-hidden="true"><polygon points="20,1 39,11.5 20,22 1,11.5" fill="${c.t}"/><polygon points="1,11.5 20,22 20,45 1,34.5" fill="${c.l}"/><polygon points="20,22 39,11.5 39,34.5 20,45" fill="${c.r}"/>`;

  return s+`<polyline points="1,11.5 20,22 39,11.5" fill="none" stroke="rgba(255,255,255,.28)"/></svg>`}

 chicken:`<rect x="27" y="40" width="3" height="12" fill="#e89a2a"/><rect x="36" y="40" width="3" height="12" fill="#e89a2a"/><rect x="23" y="50" width="9" height="3" fill="#e89a2a"/><rect x="33" y="50" width="9" height="3" fill="#e89a2a"/><rect x="12" y="22" width="32" height="20" fill="#fbf8f0" stroke="#cfc8bc" stroke-width="1.2"/><rect x="16" y="26" width="16" height="10" fill="#e8e2d4"/><rect x="34" y="6" width="16" height="20" fill="#fbf8f0" stroke="#cfc8bc" stroke-width="1.2"/><rect x="50" y="12" width="9" height="6" fill="#f0a020"/><rect x="48" y="18" width="5" height="7" fill="#d9363e"/><rect x="38" y="1" width="8" height="5" fill="#d9363e"/><rect x="43" y="10" width="3" height="4" fill="#2b2b2b"/>`,
 sheep:`<rect x="12" y="40" width="7" height="12" fill="#b88a62"/><rect x="22" y="40" width="7" height="12" fill="#b88a62"/><rect x="34" y="40" width="7" height="12" fill="#b88a62"/><rect x="43" y="40" width="7" height="12" fill="#b88a62"/><rect x="8" y="18" width="44" height="24" fill="#f1ede4" stroke="#cfc8bc" stroke-width="1.2"/><rect x="14" y="22" width="6" height="5" fill="#e2ddd1"/><rect x="30" y="30" width="6" height="5" fill="#e2ddd1"/><rect x="44" y="10" width="18" height="20" fill="#d9b18b"/><rect x="44" y="6" width="18" height="7" fill="#f1ede4" stroke="#cfc8bc" stroke-width="1.2"/><rect x="55" y="23" width="7" height="5" fill="#e9a0a6"/><rect x="51" y="15" width="4" height="4" fill="#2b2b2b"/><rect x="40" y="13" width="5" height="4" fill="#c4976e"/>`,
 cow:`<rect x="12" y="40" width="7" height="12" fill="#3f2816"/><rect x="22" y="40" width="7" height="12" fill="#3f2816"/><rect x="34" y="40" width="7" height="12" fill="#3f2816"/><rect x="43" y="40" width="7" height="12" fill="#3f2816"/><rect x="8" y="18" width="44" height="24" fill="#6b4428"/><rect x="14" y="20" width="10" height="8" fill="#f1ede4"/><rect x="32" y="30" width="12" height="8" fill="#f1ede4"/><rect x="40" y="8" width="20" height="20" fill="#6b4428"/><rect x="48" y="20" width="14" height="9" fill="#e8b6a8"/><rect x="52" y="22" width="2" height="3" fill="#6b3a30"/><rect x="58" y="22" width="2" height="3" fill="#6b3a30"/><rect x="42" y="3" width="4" height="6" fill="#ddd6c6"/><rect x="54" y="3" width="4" height="6" fill="#ddd6c6"/><rect x="45" y="12" width="4" height="4" fill="#fff"/><rect x="48" y="12" width="2" height="4" fill="#1d1d1d"/>`};
 return `<svg class="ani" viewBox="0 0 66 56" aria-hidden="true">${o[k]}</svg>`}
function px(rows,pal){const w=Math.max(...rows.map(r=>r.length)),h=rows.length;let s='';rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(pal[c])s+=`<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${pal[c]}"/>`}));return`<svg class="tok" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`}
const TOK={
 carrot:px(['.......GG.','......GGgG','.....OGg..','....OOO...','...OOdO...','..OOOO....','..OdO.....','.OOO......','.OO.......','O.........'],{G:'#4f9a2c',g:'#2f7a1f',O:'#f08a24',d:'#c96a12'}),
 apple:px(['.....b....','.....bLL..','..RRRbRR..','.RRRRRRRR.','.RwwRRRRR.','.RwRRRRRR.','.RRRRRRRR.','.RRRRRRRd.','..RRRRRd..','...RR.R...'],{b:'#5e3c1f',L:'#4f9a2c',R:'#d93a3a',w:'#ff9a8a',d:'#a82525'}),
 wheat:px(['..Y..Y..Y.','.YYy.Y.yY.','..YYyYyY..','...YYYYY..','....yYy...','....gYg...','....gyg...','...ggygg..','..gg.y.gg.','.....y....'],{Y:'#f3cf55',y:'#c99b2b',g:'#8a6a22'}),
 gem:px(['...CCCC...','..CwCCCC..','.CwCCCCCC.','.CCCCCCCC.','.cCCCCCCc.','..cCCCCc..','...cCCc...','....cc....'],{C:'#4fd1e0',w:'#c9f6ff',c:'#1f97aa'}),
 star:px(['....YY....','....YY....','...YYYY...','YYYYwYYYYY','.YYYYYYYY.','..YYYYYY..','..YYYYYY..','.YYY..YYY.','.YY....YY.','YY......YY'],{Y:'#f4b81c',w:'#fff2b0'})
};
function coin(v){const cu=v<5,r={1:15,2:19,5:13.5,10:18.5}[v]||16,fill=cu?'#c8743a':'#c9ccd1',edge=cu?'#8f4c22':'#8a8e94',hi=cu?'#e39a62':'#f4f5f6';
 return`<svg class="tok coin" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="${edge}"/><circle cx="20" cy="20" r="${r-2.4}" fill="${fill}"/><circle cx="20" cy="20" r="${r-4.8}" fill="none" stroke="${hi}" stroke-width="1.2"/><text x="20" y="${v>=10?24.5:25}" text-anchor="middle" font-family="Lilita One,Arial Rounded MT Bold,sans-serif" font-size="${v>=10?12:v===5?11:14}" fill="#fff" stroke="${edge}" stroke-width=".5">${v}p</text></svg>`}

function clockFace(h,m,setter){const ha=((h%12)+m/60)*30,ma=m*6;let s=`<svg class="clock" viewBox="0 0 200 200" aria-label="Clock"><circle cx="100" cy="100" r="97" fill="#4f5357"/><circle cx="100" cy="100" r="88" fill="#fffdf6"/>`;
 for(let i=0;i<60;i++){const a=i*6*Math.PI/180,L=i%5?4:8;s+=`<line x1="${100+84*Math.sin(a)}" y1="${100-84*Math.cos(a)}" x2="${100+(84-L)*Math.sin(a)}" y2="${100-(84-L)*Math.cos(a)}" stroke="#8a8e94" stroke-width="${i%5?1:2.5}"/>`}
 for(let i=1;i<=12;i++){const a=i*30*Math.PI/180,x=100+64*Math.sin(a),y=100-64*Math.cos(a);const t=`<text x="${x}" y="${y+7}" text-anchor="middle" font-family="Lilita One,Arial Rounded MT Bold,sans-serif" font-size="21" fill="#1d2b1f">${i}</text>`;
  s+=setter?`<g class="hourbtn" data-act="hour" data-h="${i}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/>${t}</g>`:t}
 s+=`<g class="hand" id="mhand" style="transform:rotate(${ma}deg)"><line x1="100" y1="108" x2="100" y2="26" stroke="#2f86b8" stroke-width="6" stroke-linecap="round"/></g><g class="hand" id="hhand" style="transform:rotate(${ha}deg)"><line x1="100" y1="106" x2="100" y2="54" stroke="#1d2b1f" stroke-width="10" stroke-linecap="round"/></g><circle cx="100" cy="100" r="7" fill="#1d2b1f"/></svg>`;return s}
function cakeSvg(shape,cut){const F='#f2c6d0',T='#e889a2',D='#7a3b2e';let body,lines='';

const isBlock=k=>k in BL;
function art(k){if(isBlock(k))return cube(k);if(TOK[k])return TOK[k];let m;

const NM={pig:['pig','pigs'],chicken:['chicken','chickens'],sheep:['sheep','sheep'],cow:['cow','cows'],grass:['grass block','grass blocks'],stone:['stone block','stone blocks'],wood:['wood block','wood blocks'],gold:['treasure block','treasure blocks'],carrot:['carrot','carrots'],apple:['apple','apples'],wheat:['bundle of wheat','bundles of wheat'],gem:['gem','gems'],star:['star','stars']};

/* ================= the growing build (meta game) ================= */
const BUILDS=[
 {name:"Nel's house",g:['....RR....','...RRRR...','..RRRRRR..','.RRRRRRRR.','..WWWWWW..','..WGWWGW..','..WWDDWW..','..SSDDSS..']},

];

function buildAt(g){let i=0,rem=g;while(rem>=BUILDS[i%BUILDS.length].cells.length){rem-=BUILDS[i%BUILDS.length].cells.length;i++}return{i,b:BUILDS[i%BUILDS.length],placed:rem}}
function drawBuild(b,placed,newFrom=placed){const W=Math.max(...b.g.map(r=>r.length)),H=b.g.length,c=10;let s=`<svg viewBox="-2 -2 ${W*c+4} ${H*c+8}" aria-hidden="true"><rect x="-2" y="${H*c}" width="${W*c+4}" height="8" fill="#6b4526"/><rect x="-2" y="${H*c}" width="${W*c+4}" height="3" fill="#7cc444"/>`;
 b.cells.forEach(([x,y,m],i)=>{const X=x*c,Y=y*c;if(i<placed){const [a,d]=MAT[m];const delay=i>=newFrom?` class="newb" style="animation-delay:${(i-newFrom)*.18+.2}s"`:'';

 if(S.early)DB.logs[0].routes=['Stopped early'];
 stage().innerHTML=`<div class="done"><h2>${S.early?'Great work, Nel!':'Mission complete!'}</h2><p>${msg}</p><div class="bigbuild">${pic}</div>
  <div class="tools"><button class="btn go" data-act="again">Play again</button>${S.l<3?`<button class="btn gold" data-act="up">Try ${LV[S.l][0]}</button>`:''}<button class="btn soft" data-act="home">Other missions</button></div>
  <div class="routes"><h3>For Niamh · optional · how did Nel join in?</h3><div class="toggles">${ROUTES.map(r=>`<button class="chip" data-act="route" data-v="${r}" aria-pressed="false">${r}</button>`).join('')}</div></div></div>`;
 S.i=S.total;stage().scrollTop=0}
function showNotes(){S=null;RD=null;setBar('Grown-ups','Settings and notes',true);document.body.classList.toggle('calm',!!DB.calm);
 const name=id=>(M.find(m=>m.id===id)||{}).title||id,fmt=d=>new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 const fav={};DB.logs.forEach(L=>fav[L.m]=(fav[L.m]||0)+1);const top=Object.entries(fav).sort((a,b)=>b[1]-a[1])[0];
 const ch=(act,v,cur,label)=>`<button class="chip small" data-act="${act}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${label}</button>`;
 stage().innerHTML=`<div class="notes"><div class="settings"><h3>Settings</h3>
  <div class="setrow"><b>Rounds per mission</b>${[3,5,8].map(v=>ch('setrounds',v,DB.rounds,v)).join('')}</div>
  <div class="setrow"><b>Calm mode</b>${ch('setcalm',1,DB.calm?1:0,'On')}${ch('setcalm',0,DB.calm?1:0,'Off')}<span class="hint" style="text-align:left">Softer sounds, slower voice, no buzz for a wrong try</span></div>
  <div class="setrow"><b>Nel's buddy</b>${['pig','sheep','cow','chicken','none'].map(v=>ch('setbuddy',v,DB.buddy,v==='none'?'No buddy':cap(v))).join('')}</div>
  <div class="setrow"><b>Read aloud</b>${ch('setvoice',1,DB.voice?1:0,'On')}${ch('setvoice',0,DB.voice?1:0,'Off')}<b style="min-width:0;margin-left:10px">Sounds</b>${ch('setsound',1,DB.sound?1:0,'On')}${ch('setsound',0,DB.sound?1:0,'Off')}</div></div>
 <div class="tipsbox"><h3>Keeping it fun</h3><ul><li>Let Nel pick the mission. Choice keeps him in charge.</li><li>Stop while it's still fun. 5 to 10 minutes is a great session.</li><li>Use "Finish here" any time. Every treasure block still goes on his build.</li><li>Build the same thing with real blocks or Lego, then do it on the iPad.</li><li>Replaying a favourite mission is learning too.</li></ul></div>
 <p class="tip"><b>Notes are saved on this iPad only.</b> ${DB.logs.length?`${DB.logs.length} sessions so far. Most played: <b>${name(top[0])}</b>. Repeating a favourite counts too.`:'Notes appear here after each mission.'}</p>
 ${DB.logs.length?DB.logs.map(L=>`<div class="note"><div class="top"><span>${name(L.m)} · ${LV[L.l-1][0]}</span><span class="when">${fmt(L.d)}</span></div><div>${L.done} of ${L.of} rounds · ${L.first} right first try</div>${L.routes.length?`<div class="tags">${L.routes.map(r=>`<span>${r}</span>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty-note">No missions played yet.</div>'}
 ${DB.logs.length?'<div class="confirm"><button class="chip" data-act="clear">Clear all notes</button></div>':''}</div>`}

/* ================= buttons ================= */
const H={
 home(){if(S&&S.i>0&&S.i<S.total)logIt(['Stopped early']);showHome()},
 mission(b){showLevels(b.dataset.id)},
 start(b){start(b.dataset.id,+b.dataset.l)},
 speak(){if(RD)say(RD.asking?RD.q.say:RD.say)},
 voice(b){DB.voice=!DB.voice;save();b.setAttribute('aria-pressed',DB.voice);if(DB.voice)say('I will read the missions out loud.');else try{speechSynthesis.cancel()}catch(e){}},
 sound(b){DB.sound=!DB.sound;save();b.setAttribute('aria-pressed',DB.sound);sfx.pop()},
 done(){if(!RD||RD.locked)return;const r=RD.check();if(r.ok)boardDone();else wrong(r.msg)},
 reset(){if(!RD||RD.locked)return;clearSel();if(RD.custom0)RD.custom={...RD.custom0};render();sfx.back()},
 herd(){if(!RD||RD.locked)return;const t=zoneEl(RD.herdTo);allZones().filter(z=>cfg(z).home).flatMap(itemsIn).forEach((it,i)=>setTimeout(()=>{if(!RD.locked&&it.closest('.zone')&&cfg(it.closest('.zone')).home)place(it,t)},i*110))},
 answer(b){if(!RD||RD.won)return;if(String(b.dataset.v)===String(RD.q.answer)){b.classList.add('right');correct(RD.yes)}else{b.classList.add('wrong');S.miss++;sfx.no();note('Not quite. Count again!');if(S.miss>=2)hintOn()}},
next(){next()},
 hour(b){if(!RD||RD.locked||!RD.custom)return;const h=+b.dataset.h;RD.custom.h=h;const hh=$('#hhand');if(hh)hh.style.transform=`rotate(${h*30}deg)`;sfx.pop();say(`${h} o'clock`);$('#fb').innerHTML=''},
 stopnow(){if(!S)return;if(S.i===0){showHome();return}S.total=S.i;S.early=true;finish()},
 again(){start(S.m.id,S.l)},
 up(){start(S.m.id,S.l+1)},
 route(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const L=DB.logs[0];if(L){const v=b.dataset.v;L.routes=on?[...new Set([...L.routes,v])]:L.routes.filter(x=>x!==v);save()}},
notes(){showNotes()},
 setrounds(b){DB.rounds=+b.dataset.v;save();showNotes()},
 setcalm(b){DB.calm=b.dataset.v==='1';save();showNotes()},
 setbuddy(b){DB.buddy=b.dataset.v;save();showNotes()},
 setvoice(b){DB.voice=b.dataset.v==='1';save();showNotes()},
 setsound(b){DB.sound=b.dataset.v==='1';save();showNotes();sfx.pop()},
 clear(b){b.parentElement.innerHTML=`<span>Delete all notes on this iPad?</span><button class="chip" data-act="clearyes">Yes, delete</button><button class="chip" data-act="notes">Keep them</button>`},
 clearyes(){DB.logs=[];save();showNotes()}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(b){const f=H[b.dataset.act];if(f)f(b,e);return}
 const z=e.target.closest('#board .zone');
 if(Date.now()-lastHandled<600)return;
 if(z&&RD&&RD.locked)return tapZone(z);
 if(e.target.closest('#board .item, #board .spawner'))return;
 if(z)tapZone(z);else if(sel&&!e.target.closest('#board'))clearSel()});
$('#purseCube').innerHTML=cube('gold');document.body.classList.toggle('calm',!!DB.calm);
try{speechSynthesis.getVoices()}catch(e){}
showHome();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
